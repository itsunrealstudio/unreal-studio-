<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unreal Studio — Websites people can’t stop scrolling through</title>
<meta name="description" content="Unreal Studio is a creative digital studio designing and building interactive websites.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Unreal Studio">
<meta property="og:title" content="Unreal Studio">
<meta property="og:description" content="We create websites people can’t stop scrolling through.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  color-scheme: dark;
  --black:#000000; --white:#FFFFFF; --magenta:#FF00C8;
  --mint:#00FFB2; --cyan:#00CFFF; --violet:#653BFF; --coral:#FF5A5F; --lime:#A8FF00; --deep:#070B33;
  --muted:#A6A6A6; --line:rgba(255,255,255,.16);
  --font:"Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --gutter:clamp(20px,4vw,64px);
  --maxw:1600px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-in:cubic-bezier(.7,0,.84,0);
  --dur:.6s;
  --nav-h:72px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The brand is black-dominant in every viewer theme, so both schemes share one palette. */
:root:not([data-theme="light"]), :root[data-theme="dark"]{ --black:#000000; --white:#FFFFFF; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --black:#000000; } }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{overflow-x:clip}
body{margin:0;background:var(--black);color:var(--white);font-family:var(--font);font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--black)}
img,video{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--magenta);outline-offset:4px;border-radius:2px}
::selection{background:var(--magenta);color:var(--black)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:16px;top:-80px;z-index:200;background:var(--magenta);color:var(--black);padding:10px 16px;font-weight:600}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 12px)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter)}

/* ============ NAVIGATION ============ */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--black) 55%,rgba(0,0,0,0))}
.nav-inner{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;align-items:center;height:44px}
.logo img{height:30px;width:auto}
.nav-links{display:flex;gap:clamp(18px,2.6vw,40px);list-style:none;margin:0;padding:0}
.nav-links a{position:relative;display:inline-block;padding:12px 0;font-size:15px;font-weight:500;letter-spacing:.01em;transition:color .3s}
.nav-links a::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--magenta);transform:translateX(-50%) scale(0);transition:transform .35s var(--ease)}
.nav-links a:hover{color:var(--magenta)}
.nav-links a:hover::after{transform:translateX(-50%) scale(.6)}
.nav-links a[aria-current="page"]{color:var(--magenta)}
.nav-links a[aria-current="page"]::after{transform:translateX(-50%) scale(1)}
.menu-btn{display:none;min-width:44px;min-height:44px;background:none;border:0;padding:0 0 0 12px;cursor:pointer;align-items:center;gap:10px;font-weight:500;font-size:15px}
.menu-btn .bars{width:22px;height:10px;position:relative}
.menu-btn .bars::before,.menu-btn .bars::after{content:"";position:absolute;left:0;right:0;height:2px;background:currentColor;transition:transform .35s var(--ease)}
.menu-btn .bars::before{top:0}.menu-btn .bars::after{bottom:0}
.menu-open .menu-btn .bars::before{transform:translateY(4px) rotate(45deg)}
.menu-open .menu-btn .bars::after{transform:translateY(-4px) rotate(-45deg)}
.mobile-menu{position:fixed;inset:0;z-index:45;background:var(--black);padding:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 24px) var(--gutter) calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:space-between;clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path .55s var(--ease),visibility 0s .55s}
.menu-open .mobile-menu{clip-path:inset(0 0 0 0);visibility:visible;transition:clip-path .55s var(--ease)}
.mobile-menu ul{list-style:none;margin:0;padding:0}
.mobile-menu a{display:block;font-size:clamp(40px,12vw,72px);font-weight:300;line-height:1.15;padding:4px 0}
.mobile-menu a[aria-current="page"]{color:var(--magenta);font-weight:700}
.mobile-menu a[aria-current="page"]::before{content:"";display:inline-block;width:.18em;height:.18em;border-radius:50%;background:var(--magenta);margin-right:.25em;vertical-align:middle}
.mobile-menu p{color:var(--muted);margin:0;font-size:14px}
@media (max-width:860px){.nav-links{display:none}.menu-btn{display:flex}}

/* ============ CURSOR ============ */
.cursor{position:fixed;left:0;top:0;z-index:300;pointer-events:none;display:none}
.has-cursor .cursor{display:block}
.cursor-dot,.cursor-ring,.cursor-tag{position:fixed;left:0;top:0;pointer-events:none;will-change:transform}
.cursor-dot{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--magenta)}
.cursor-ring{width:14px;height:14px;margin:-7px 0 0 -7px}
.cursor-ring i{position:absolute;inset:0;border-radius:50%;background:var(--magenta);transition:transform .45s var(--ease),opacity .3s}
.cursor-tag{width:0;height:0}
.cursor-label{position:absolute;left:0;top:0;transform:translate(-50%,-50%) scale(.6);white-space:nowrap;font-size:12px;font-weight:600;color:var(--black);opacity:0;transition:opacity .25s,transform .45s var(--ease)}
.cursor.is-link .cursor-ring i{transform:scale(3.2);opacity:.35}
.cursor.is-label .cursor-ring i{transform:scale(7.4);opacity:1}
.cursor.is-label .cursor-label{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cursor.is-label .cursor-dot{opacity:0}
.cursor.is-text .cursor-ring i{transform:scale(.4);opacity:.5}
.cursor.is-down .cursor-ring i{transform:scale(.7)}
.cursor.is-hidden{opacity:0}

/* ============ PAGE TRANSITION ============ */
.veil{position:fixed;inset:0;z-index:90;pointer-events:none;transform:translateY(100%);background:var(--black)}
.veil::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--magenta)}
.veil.cover{transform:translateY(0);transition:transform .42s var(--ease-in)}
.veil.leave{transform:translateY(-100%);transition:transform .55s var(--ease)}
.veil.leave::before{top:auto;bottom:0}
#app{outline:none;min-height:100vh}
.page-enter [data-enter]{opacity:0;transform:translateY(40px)}
.page-enter.entered [data-enter]{opacity:1;transform:none;transition:opacity .9s var(--ease),transform 1s var(--ease);transition-delay:calc(var(--i,0) * 90ms)}

/* reveal on scroll */
[data-reveal]{opacity:0;transform:translateY(32px);transition:opacity .9s var(--ease),transform 1s var(--ease)}
[data-reveal].in{opacity:1;transform:none}

/* ============ SHARED TYPE ============ */
.kicker{font-size:14px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--magenta)}
.big-link{display:inline-flex;align-items:center;gap:14px;font-size:clamp(18px,1.6vw,22px);font-weight:500;padding:10px 0;position:relative;min-height:44px}
.big-link::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:2px;background:var(--white);transform-origin:right;transition:transform .5s var(--ease),background .3s}
.big-link:hover{color:var(--magenta)}
.big-link:hover::after{background:var(--magenta);transform:scaleX(.35);transform-origin:left}
.big-link .dot{width:10px;height:10px;border-radius:50%;background:var(--magenta);transition:transform .4s var(--ease)}
.big-link:hover .dot{transform:scale(1.6)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 32px;border-radius:999px;background:var(--magenta);color:var(--black);font-weight:600;font-size:16px;border:0;cursor:pointer;transition:background .3s,color .3s,transform .4s var(--ease)}
.btn:hover{background:var(--white)}
.btn[disabled]{opacity:.55;cursor:progress}
.btn--ghost{background:transparent;color:var(--white);box-shadow:inset 0 0 0 1.5px var(--white)}
.btn--ghost:hover{background:var(--white);color:var(--black)}
section{position:relative}
.sec{padding-block:clamp(96px,14vw,200px)}

/* ============ PROJECT TILES ============ */
.tile{display:block;position:relative;color:var(--white)}
.tile-media{position:relative;overflow:hidden;border-radius:6px;aspect-ratio:var(--ratio,4/3);background:var(--bg,#111);transition:border-radius .6s var(--ease)}
.tile-media>svg,.tile-media>img,.tile-media>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.tile:hover .tile-media>svg,.tile:hover .tile-media>img,.tile:hover .tile-media>video{transform:scale(1.06)}
.tile:hover .tile-media{border-radius:24px}
.tile-tag{position:absolute;left:12px;top:12px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.72);color:var(--white)}
.tile-meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:14px}
.tile-title{font-size:clamp(17px,1.4vw,21px);font-weight:600;line-height:1.25}
.tile-cat{font-size:14px;color:var(--muted);text-align:right}
.tile-title span{display:inline-block;transition:transform .5s var(--ease),color .3s}
.tile:hover .tile-title span{color:var(--magenta);transform:translateX(6px)}

/* ============ HOME ============ */
.hero{position:relative;height:250vh;min-height:1500px;overflow-x:clip}
.hero-stage{position:sticky;top:0;height:100vh;min-height:600px;display:flex;align-items:center;overflow:hidden;z-index:2;pointer-events:none;mix-blend-mode:difference}
.hero-head{position:relative;z-index:3;margin:0;width:100%;font-weight:300;font-size:clamp(46px,9.4vw,168px);line-height:.98;letter-spacing:-.045em;color:#fff}
.hero-head .l{display:block;white-space:nowrap;will-change:transform}
.hero-head .l1{font-weight:200}
.hero-head .l2{font-weight:700;padding-left:clamp(0px,11vw,220px)}
.hero-head .l3{font-weight:800;padding-left:clamp(0px,4vw,80px)}
.hero-head .stop{display:inline-block;width:.16em;height:.16em;border-radius:50%;background:var(--magenta);margin-left:.04em;mix-blend-mode:normal}
.hero-tiles{position:absolute;inset:0}
.hero-tiles .tile{position:absolute;width:var(--w);will-change:transform;z-index:1}
.hero-tiles .tile.front{z-index:4}
.hero-tiles .tile-meta{padding-top:8px}
.hero-tiles .tile-title{font-size:14px}
.hero-tiles .tile-cat{font-size:12px}
.hero-marks{position:absolute;inset:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 8px) var(--gutter) 28px;z-index:5;display:flex;flex-direction:column;justify-content:space-between;font-size:13px;color:var(--muted);pointer-events:none}
.hero-marks .row{display:flex;justify-content:space-between;gap:20px}
.scroll-cue{display:flex;align-items:center;gap:10px;color:var(--white)}
.scroll-cue i{width:8px;height:8px;border-radius:50%;background:var(--magenta);animation:bob 1.8s var(--ease) infinite}
@keyframes bob{0%,100%{transform:translateY(-4px)}50%{transform:translateY(5px)}}
/* shared tile motion */
.tile-media{isolation:isolate}
.tile-media svg .spin{transform-box:fill-box;transform-origin:center;animation:spin 48s linear infinite}
.tile-media svg .float{animation:float 7s ease-in-out infinite}
.tile-media svg .hv,.tile-media svg .bar{transform-box:fill-box;transform-origin:center;transition:transform 1s var(--ease)}
.tile-media svg .bar{transform-origin:bottom}
.tile:hover .tile-media svg .hv,.tile:focus-visible .tile-media svg .hv{transform:translate(var(--hx,0px),var(--hy,0px)) rotate(var(--hr,0deg)) scale(var(--hs,1))}
.tile:hover .tile-media svg .bar,.tile:focus-visible .tile-media svg .bar{transform:scaleY(var(--sy,1))}
.tile-media svg .draw{stroke-dasharray:700;stroke-dashoffset:0;transition:stroke-dashoffset 1.4s var(--ease)}
.tile:hover .tile-media svg .draw{stroke-dashoffset:1400}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
.tile-go{position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;background:var(--black);display:grid;place-items:center;transform:scale(0) rotate(-45deg);transition:transform .6s var(--ease)}
.tile-go svg{width:18px;height:18px;stroke:var(--magenta);fill:none;stroke-width:2}
.tile:hover .tile-go,.tile:focus-visible .tile-go{transform:scale(1) rotate(0)}
.tile-media::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 0 var(--magenta);transition:box-shadow .5s var(--ease);pointer-events:none}
.tile:hover .tile-media::after,.tile:focus-visible .tile-media::after{box-shadow:inset 0 0 0 3px var(--ring,var(--magenta))}
.tile-title{position:relative}
.tile-title::after{content:"";position:absolute;left:0;bottom:-4px;height:2px;width:100%;background:var(--magenta);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.tile:hover .tile-title::after,.tile:focus-visible .tile-title::after{transform:scaleX(1)}
.tile:hover .tile-cat{color:var(--white)}
.tile-cat{transition:color .3s}
.tile:focus-visible{outline:none}
.tile:focus-visible .tile-media{outline:2px solid var(--magenta);outline-offset:4px}
/* staggered tile entrance (varied per tile via custom properties) */
.rv-tile{opacity:0;transform:translate3d(var(--tx,0px),var(--ty,70px),0) rotate(var(--rot,0deg)) scale(var(--sc,.92));transition:opacity .9s var(--ease) var(--d,0s),transform 1.3s var(--ease) var(--d,0s)}
.rv-tile.in{opacity:1;transform:none}
.par{will-change:transform}

/* home work preview */
.home-work{padding-top:clamp(40px,6vw,100px)}
.home-work .head{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:end;margin-bottom:clamp(48px,6vw,88px)}
.home-work .head .kicker{grid-column:1 / -1;margin:0 0 8px}
.home-work .lede{grid-column:1 / span 7;font-size:clamp(34px,4.6vw,76px);max-width:none}
.home-work .head .aside{grid-column:9 / -1;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.home-work .head .aside p{margin:0;color:var(--muted);font-size:16px;max-width:26em}
.home-work .rule{grid-column:1 / -1;height:1px;background:var(--line);transform:scaleX(0);transform-origin:left;transition:transform 1.6s var(--ease)}
.home-work .head.in .rule{transform:scaleX(1)}
.hw-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(16px,2vw,32px);row-gap:clamp(56px,7vw,112px);grid-template-areas:"a a a a a a a . b b b b" ". c c c c . d d d d d d"}
.hw-grid > :nth-child(1){grid-area:a}
.hw-grid > :nth-child(2){grid-area:b;align-self:end}
.hw-grid > :nth-child(3){grid-area:c}
.hw-grid > :nth-child(4){grid-area:d;margin-top:clamp(40px,8vw,140px)}
.hw-grid .num{display:block;font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:500}
.hw-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:24px;margin-top:clamp(64px,8vw,120px);padding-top:28px;border-top:1px solid var(--line)}
.hw-foot p{margin:0;color:var(--muted)}
@media (max-width:1023px){
  .hw-grid{grid-template-areas:"a a a a a a a a a a a a" "b b b b b b c c c c c c" "d d d d d d d d d d d d"}
  .hw-grid > :nth-child(2){align-self:start}
  .hw-grid > :nth-child(4){margin-top:0}
  .home-work .lede{grid-column:1 / -1}.home-work .head .aside{grid-column:1 / -1}
}
@media (max-width:640px){.hw-grid{grid-template-areas:"a" "b" "c" "d";grid-template-columns:1fr}}
.svc-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.svc-list li{border-bottom:1px solid var(--line)}
.svc-list a{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:clamp(18px,2.4vw,34px) 0;font-size:clamp(28px,5.4vw,88px);font-weight:300;letter-spacing:-.04em;line-height:1.05;transition:color .35s,padding .6s var(--ease)}
.svc-list a:hover{color:var(--magenta);padding-left:clamp(8px,2vw,32px)}
.svc-list .sw{flex:none;width:clamp(14px,1.6vw,22px);height:clamp(14px,1.6vw,22px);border-radius:50%;background:var(--c);transition:transform .5s var(--ease)}
.svc-list a:hover .sw{transform:scale(1.8)}
.statement{font-size:clamp(30px,4.6vw,78px);font-weight:300;line-height:1.1;letter-spacing:-.035em;margin:0;max-width:18ch}
.statement b{font-weight:700}
.about-prev{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px}
.about-prev .statement{grid-column:3 / -1}
.about-prev .side{grid-column:3 / -1;margin-top:40px}
@media (max-width:760px){.about-prev .statement,.about-prev .side{grid-column:1 / -1}}
.bot-prev{display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between;align-items:flex-end}
.bot-prev h2{margin:0;font-size:clamp(34px,5vw,84px);font-weight:600;letter-spacing:-.04em;line-height:1.02;max-width:12ch}
.bot-prev h2 span{display:block;font-weight:200}
.chips{display:flex;flex-wrap:wrap;gap:10px;max-width:640px;margin-top:28px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-size:15px;transition:box-shadow .3s,color .3s,background .3s}
.chip:hover{box-shadow:inset 0 0 0 1px var(--magenta);color:var(--magenta)}
.contact-prev{text-align:left}
.contact-prev a.huge{display:block;font-size:clamp(46px,10vw,190px);font-weight:700;letter-spacing:-.055em;line-height:.92;transition:color .4s}
.contact-prev a.huge span{display:block;font-weight:200}
.contact-prev a.huge:hover{color:var(--magenta)}

/* ============ FOOTER ============ */
.footer{border-top:1px solid var(--line);padding-block:56px calc(40px + env(safe-area-inset-bottom,0px))}
.footer .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:40px}
.footer ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 28px}
.footer ul a{display:inline-block;padding:8px 0;color:var(--muted);transition:color .3s}
.footer ul a:hover,.footer ul a[aria-current="page"]{color:var(--white)}
.foot-mail{color:var(--white);transition:color .3s;padding:8px 0}
.foot-mail:hover{color:var(--magenta)}
.ct-mail-label{margin:40px 0 4px !important;font-size:14px !important;color:var(--muted);font-weight:500 !important}
.ct-mail{font-size:clamp(17px,1.4vw,20px);word-break:break-all}
.footer .bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;margin-top:56px;font-size:14px;color:var(--muted)}

/* ============ ABOUT ============ */
.about-hero{overflow-x:clip;padding-top:calc(var(--nav-h) + 12vh);padding-bottom:10vh}
.play{margin:0;font-size:clamp(64px,15vw,280px);line-height:.86;letter-spacing:-.06em;user-select:none}
.play .w{display:block;white-space:nowrap}
.play .w1{font-weight:200}
.play .w2{font-weight:300;padding-left:24vw;font-size:.55em;letter-spacing:-.03em;line-height:1.2}
.play .w3{font-weight:800;padding-left:6vw}
.ch{display:inline-block;transition:transform .5s var(--ease),color .4s;will-change:transform}
.ch.hot{color:var(--magenta)}
.about-body{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px}
.about-body .copy{grid-column:6 / span 6;font-size:clamp(19px,1.6vw,24px);line-height:1.6;font-weight:300}
.about-body .copy p{margin:0 0 1.2em;max-width:38em}
.about-body .copy p:last-child{font-weight:500;color:var(--white)}
.about-body .copy em{font-style:normal;color:var(--magenta)}
.about-body .label{grid-column:1 / span 4}
@media (max-width:860px){.about-body .copy,.about-body .label{grid-column:1 / -1}}
.ff{overflow:hidden;padding-block:clamp(60px,10vw,160px)}

.fd-grid > *{min-width:0}

.founder.in .fd-kick{opacity:1;transform:none}
/* Headline: same line-mask reveal + cursor-reactive letters as before */
.fd-head{grid-column:1 / -1;grid-row:2;margin:0;font-size:clamp(46px,8.4vw,150px);font-weight:300;letter-spacing:-.05em;line-height:.98;user-select:none}

.fd-head .u::after{content:"";position:absolute;left:0;right:.04em;bottom:-.06em;height:.06em;border-radius:.04em;background:var(--magenta);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease) 1.15s}

.fd-role::before{content:"";width:clamp(36px,4vw,64px);height:1.5px;background:var(--magenta);flex:none}
.fd-role b{color:var(--white);font-weight:600}
.founder.in .fd-role{opacity:1;transform:none}
/* Text column (left) and photo (right) */
.fd-split{grid-column:1 / -1;grid-row:4;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(16px,2vw,32px);align-items:start}
.fd-split > *{min-width:0}
.fd-lead{grid-column:1 / span 5;grid-row:1;margin:clamp(48px,5vw,88px) 0 0;font-size:clamp(19px,1.5vw,24px);line-height:1.5;font-weight:300;color:var(--white);letter-spacing:-.005em}
.fd-body{grid-column:1 / span 5;grid-row:2;margin-top:clamp(26px,2.4vw,40px);display:grid;gap:clamp(18px,1.6vw,26px)}
.fd-body p{margin:0;font-size:clamp(15.5px,1.08vw,17px);line-height:1.75;color:#D6D6D6}
.fd-p em,.fd-body em{font-style:normal;color:var(--magenta);font-weight:500}
.fd-p{transform:translateY(26px);transition:transform 1.2s var(--ease) var(--d,0s)}
.fd-p .s{opacity:0;transition:opacity 1s var(--ease) calc(var(--d,0s) + var(--k) * 140ms)}
.fd-p.in{transform:none}
.fd-p.in .s{opacity:1}
/* Photo: complete original frame (no crop) — aspect ratio locked to the photograph, object-fit: contain */
.fd-photo{grid-column:6 / -1;grid-row:1 / span 2;align-self:start;position:sticky;top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 28px);margin-top:clamp(48px,5vw,88px);padding:0 18px 18px 0}
.fd-photo .frame{position:absolute;inset:18px 0 0 18px;border:1.5px solid var(--magenta);border-radius:10px;transform:scaleY(0);transform-origin:top;transition:transform 1.2s var(--ease) 1.2s,inset .7s var(--ease)}
.fd-tilt{position:relative;z-index:1;transition:transform .7s var(--ease);transform-style:preserve-3d}
.fd-photo .mask{position:relative;margin:0;overflow:hidden;border-radius:10px;aspect-ratio:1442 / 1091;background:#0d0d0d;clip-path:inset(100% 0 0 0 round 10px);transition:clip-path .75s var(--ease-in) .3s;will-change:transform}
.fd-photo .curtain{position:absolute;inset:0;z-index:2;background:var(--magenta);transform:scaleY(0);transform-origin:50% 100%}
.fd-pi{position:absolute;inset:0}
.fd-photo img{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 50%;filter:grayscale(1) contrast(1.08);transform:scale(1.18);transition:transform 2.2s var(--ease) .9s,filter 1s var(--ease)}
.fd-photo .cap{position:absolute;left:16px;bottom:16px;z-index:3;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.72);color:var(--white);opacity:0;transform:translateY(8px);transition:opacity .6s var(--ease) 2s,transform .8s var(--ease) 2s}
@keyframes curtain{0%{transform:scaleY(0);transform-origin:50% 100%}46%{transform:scaleY(1);transform-origin:50% 100%}54%{transform:scaleY(1);transform-origin:50% 0}100%{transform:scaleY(0);transform-origin:50% 0}}
.founder.in .fd-photo .mask{clip-path:inset(0 0 0 0 round 10px)}
.founder.in .fd-photo .curtain{animation:curtain 1.5s var(--ease) .3s both}
.founder.in .fd-photo img{transform:none}
.founder.in .fd-photo .frame{transform:scaleY(1)}
.founder.in .fd-photo .cap{opacity:1;transform:none}
.founder.in .fd-head .ln > span{transform:none}
.founder.in .fd-head .u::after{transform:scaleX(1)}
.fd-photo:hover img{filter:grayscale(0) contrast(1);transition:transform 1.2s var(--ease),filter .9s var(--ease)}
.fd-photo:hover .frame{inset:9px 9px 9px 9px}
@media (hover:none){.founder.done .fd-photo img{filter:grayscale(0) contrast(1);transition:filter 1.6s var(--ease)}}
/* Closing statement */
.fd-quote{grid-column:1 / -1;grid-row:5;position:relative;margin:clamp(96px,10vw,180px) 0 0;padding:0 0 0 clamp(0px,8.4vw,150px);font-size:clamp(30px,4.6vw,76px);line-height:1.06;letter-spacing:-.04em;font-weight:200;color:var(--white);user-select:none}

.fd-quote.in .mark{transform:none;opacity:1}

.ct h1{margin:20px 0 0;font-size:clamp(50px,9.5vw,176px);font-weight:700;letter-spacing:-.055em;line-height:.92}
.ct h1 .lt{font-weight:200;display:block}
.ct h1 .in{display:block;padding-left:8vw}
.ct-grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:clamp(32px,5vw,96px);margin-top:clamp(56px,7vw,120px)}
@media (max-width:860px){.ct-grid{grid-template-columns:1fr}}
.ct-grid .side p{margin:0;font-size:clamp(18px,1.5vw,22px);font-weight:300;max-width:22em}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 32px}
.form .full{grid-column:1 / -1}
@media (max-width:620px){.form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500;color:#D6D6D6}
.field label .opt{color:var(--muted);font-weight:400}
.field input,.field select,.field textarea{width:100%;background:transparent;border:0;border-bottom:1.5px solid rgba(255,255,255,.4);border-radius:0;padding:12px 0;font-size:18px;min-height:52px;transition:border-color .3s}
.field select{appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(-45deg,transparent 50%,#fff 50%);background-position:calc(100% - 12px) 55%,calc(100% - 6px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.field select option{background:#111;color:#fff}
.field textarea{resize:vertical;min-height:140px;line-height:1.6}
.field input:hover,.field select:hover,.field textarea:hover{border-color:rgba(255,255,255,.75)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--magenta)}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{box-shadow:0 2px 0 0 var(--magenta)}
.field.err input,.field.err textarea{border-color:var(--coral)}
.field .msg-err{font-size:14px;color:#FF8A8E;min-height:1.4em}
.form-actions{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:24px}
.status{font-size:15px;max-width:40em;padding:16px 20px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.status:empty{display:none}
.status.ok{box-shadow:inset 0 0 0 1px var(--mint)}
.status.warn{box-shadow:inset 0 0 0 1px var(--magenta)}
.status.bad{box-shadow:inset 0 0 0 1px var(--coral)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.closing{padding-block:clamp(100px,12vw,200px)}
.closing p{margin:0 0 32px;font-size:clamp(44px,8vw,150px);font-weight:200;letter-spacing:-.055em;line-height:.95}
.closing p b{font-weight:800}

/* ============ REDUCED MOTION ============ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important;scroll-behavior:auto !important}
  [data-reveal]{opacity:1;transform:none}
  .page-enter [data-enter]{opacity:1;transform:none}
  .hero{height:auto;min-height:0}
  .hero-stage{position:relative;height:auto;min-height:100vh;padding-block:140px 60px;flex-direction:column;align-items:stretch;pointer-events:auto}
  .hero-tiles{position:relative;inset:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:20px;margin-top:48px}
  .hero-tiles .tile{position:relative;left:auto !important;top:auto !important;width:auto}
  .hero-stage{mix-blend-mode:normal}
  .cat-name .solid{clip-path:none}
  .rv-tile{opacity:1;transform:none}
  .fd-head .ln > span,.fd-p,.fd-p .s,.fd-photo img,.fd-pi,.fd-tilt{transform:none !important}
  .fd-p .s{opacity:1}
  .fd-photo .mask{clip-path:none}
  .fd-photo .curtain{display:none}
  .fd-photo .frame,.fd-head .u::after{transform:none}
  .fd-photo .cap{opacity:1;transform:none}
  .fd-kick,.fd-role,.fd-quote .mark{opacity:1;transform:none}
  .fd-quote .ln > span{transform:none !important}
  .fd-quote .u::after{transform:none}
  .fd-photo .mask{transform:none !important}
  .par{transform:none !important}
  .panel,.panels .panel.on{transform:none}
}
@media (max-width:760px){
  .hero{height:200vh;min-height:1300px}
  .hero-head .l{white-space:normal}
  .hero-head .l2,.hero-head .l3{padding-left:0}
  .hero-tiles .tile{width:calc(var(--w) * 1.9)}
  .hero-tiles .tile-meta{display:none}
  .play .w2{padding-left:10vw}
}
</style>

function mediaHTML(p){
  if (p.media && p.media.type === "image") return `<img src="${esc(p.media.src)}" alt="${esc(p.media.alt||p.title)}" loading="lazy" decoding="async">`;
  if (p.media && p.media.type === "video") return `<video src="${esc(p.media.src)}" ${p.media.poster?`poster="${esc(p.media.poster)}"`:""} muted loop playsinline preload="none" data-autoplay></video>`;
  return (ART[p.art] || ART.mono)() + `<span class="tile-tag">Placeholder</span>`;
}
function tileHTML(p, opts={}){
  const ratio = opts.ratio || p.ratio;
  return `<a class="tile ${opts.cls||""}" href="${href("/work/"+p.id)}" data-cursor="${opts.label||"View project"}" data-size="${p.size}" ${opts.attrs||""}>
    ${opts.num?`<span class="${opts.num}" aria-hidden="true">${esc(p.id.split("-").pop())} / ${String(PROJECTS.length).padStart(2,"0")}</span>`:""}
    <div class="tile-media" style="--ratio:${ratio};--bg:${p.bg}${/ff00c8/i.test(p.bg)?";--ring:#fff":""}">${mediaHTML(p)}<span class="tile-go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span></div>
    <div class="tile-meta"><span class="tile-title"><span>${esc(p.title)}</span></span><span class="tile-cat">${esc(p.category)}</span></div>
    ${opts.desc?`<p>${esc(p.desc)}</p>`:""}
  </a>`;
}
function footerHTML(){

      <a class="big-link" href="${href("/contact")}"><span class="dot"></span>Start a project</a>
    </div>
    <div class="bottom"><span>© ${YEAR} Unreal Studio</span>

    </div>
  </div></footer>`;
}

function founderHTML(){
  const sentences = (t) => t.split(/(?<=\.)\s+/).map((x,k) => {
    let h = esc(x); const e = esc(FOUNDER.emphasis);
    if (h.includes(e)) h = h.replace(e, `<em>${e}</em>`);
    return `<span class="s" style="--k:${k}">${h}</span>`;
  }).join(" ");
  const [p1,p2,p3] = FOUNDER.paragraphs;
  const [q1,q2] = FOUNDER.quote;
  const words = (t) => t.split(" ").map(w => `<span class="w">${splitChars(w)}</span>`).join(" ");
  return `<section class="founder fd-anim" aria-labelledby="fdH"><div class="wrap fd-grid">
    <p class="kicker fd-kick">${esc(FOUNDER.label)}</p>
    <h2 class="fd-head" id="fdH" data-interactive aria-label="${esc(FOUNDER.greeting + " " + FOUNDER.name + ".")}">
      <span class="ln l1" aria-hidden="true"><span style="--d:0s">${splitChars(FOUNDER.greeting)}</span></span>
      <span class="ln l4" aria-hidden="true"><span style="--d:.14s"><span class="u">${splitChars(FOUNDER.name)}</span>${splitChars(".")}</span></span>
    </h2>
    <p class="fd-role"><span>${esc(FOUNDER.role[0])}, <b>${esc(FOUNDER.role[1])}</b></span></p>
    <div class="fd-split">
    <p class="fd-lead fd-p fd-anim" style="--d:.55s">${sentences(p1)}</p>
    <div class="fd-body">
      <p class="fd-p fd-anim">${sentences(p2)}</p>
      <p class="fd-p fd-anim" style="--d:.12s">${sentences(p3)}</p>
    </div>
    <div class="fd-photo">
      <span class="frame" aria-hidden="true"></span>
      <div class="fd-tilt">
        <figure class="mask">
          <div class="fd-pi"><img src="${FOUNDER.photo}" alt="${esc(FOUNDER.photoAlt)}" width="${FOUNDER.photoW}" height="${FOUNDER.photoH}" decoding="async"></div>
          <span class="curtain" aria-hidden="true"></span>
        </figure>
      </div>
    </div>
    </div>
    <blockquote class="fd-quote fd-anim" data-interactive>
      <span class="mark" aria-hidden="true">“</span>
      <span class="sr-only">${esc(q1 + " " + q2)}</span>
      <span class="ln q1" aria-hidden="true"><span style="--d:.15s">${words(q1)}</span></span>
      <span class="ln q2" aria-hidden="true"><span style="--d:.28s">${words("Great strategy")} <span class="u">${words("makes it count")}</span>${splitChars(".")}</span></span>
    </blockquote>
  </div></section>`;
}

          const b = c.getBoundingClientRect(), cx = b.left + b.width/2, cy = b.top + b.height/2;

      if (interactive) { addEventListener("pointermove", onMove, {passive:true}); document.addEventListener("pointerleave", onLeave); }

      if (RM.matches) fq.classList.add("done"); else fqLast.addEventListener("transitionend", onQDone);
      // Founder portrait: scroll parallax + pointer tilt
      const ph = $(".fd-photo"), tilt = $(".fd-tilt"), pi = $(".fd-photo .mask"); let praf = 0;
      const para = () => { praf = 0; if (RM.matches) return; const r = ph.getBoundingClientRect(); const c = (r.top + r.height/2 - innerHeight/2) / innerHeight; pi.style.transform = `translate3d(0,${(Math.max(-1,Math.min(1,c)) * 22).toFixed(1)}px,0)`; };
      const onPScroll = () => { if (!praf) praf = requestAnimationFrame(para); };
      addEventListener("scroll", onPScroll, {passive:true}); para();
      const onTilt = e => { const r = ph.getBoundingClientRect(), x = (e.clientX - r.left)/r.width - .5, y = (e.clientY - r.top)/r.height - .5; tilt.style.transform = `perspective(1000px) rotateY(${x*7}deg) rotateX(${-y*7}deg)`; };
      const offTilt = () => { tilt.style.transform = ""; };
      if (FINE.matches && !RM.matches) { ph.addEventListener("pointermove", onTilt); ph.addEventListener("pointerleave", offTilt); }
      return () => { removeEventListener("pointermove", onMove); document.removeEventListener("pointerleave", onLeave); removeEventListener("scroll", onScroll); removeEventListener("pointerdown", onTap); removeEventListener("scroll", onPScroll); last.removeEventListener("transitionend", onDone); fqLast.removeEventListener("transitionend", onQDone); };

/* =====================================================================
   CONTACT FORM — validation + pluggable submission
   ===================================================================== */
const ContactForm = {
  validators: {
    name: v => v.trim() ? "" : "Add your name so we know who we’re talking to.",
    email: v => !v.trim() ? "Add your email so we can reply." : (/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) ? "" : "That email doesn’t look complete — check for a typo."),
    details: v => v.trim().length >= 10 ? "" : "Tell us a little about the project (at least a sentence)."
  },
  async submit(data){
    if (!CONFIG.form.endpoint) {
      // No form service yet: hand the enquiry to the visitor’s email app, addressed to the studio.
      const body = `Name: ${data.name}\nEmail: ${data.email}\nProject type: ${data.projectType || "—"}\nBudget: ${data.budget || "—"}\n\n${data.details}`;
      const url = `mailto:${CONFIG.email}?subject=${encodeURIComponent("Project enquiry from " + data.name)}&body=${encodeURIComponent(body)}`;
      try { window.open(url, "_blank") || (location.href = url); } catch { }
      return {ok:false, mailto:url};
    }
    const res = await fetch(CONFIG.form.endpoint, {method:"POST", headers:{"Content-Type":"application/json", "Accept":"application/json"}, body:JSON.stringify({...data, _subject:`New enquiry from ${data.name} — Unreal Studio`})});
    return {ok: res.ok};
  },
  mount(form){
    const status = $("#f-status"), btn = $("#f-submit"); let sending = false;
    const check = (name) => {
      const el = form.elements[name], msg = this.validators[name](el.value), box = el.closest(".field");
      $("#e-" + name).textContent = msg; box.classList.toggle("err", !!msg); el.setAttribute("aria-invalid", !!msg);
      return !msg;
    };
    const onBlur = e => { const n = e.target.name; if (this.validators[n] && (e.target.value || e.type === "focusout")) check(n); };
    const onInput = e => { const n = e.target.name; if (this.validators[n] && e.target.closest(".field").classList.contains("err")) check(n); };
    form.addEventListener("focusout", onBlur); form.addEventListener("input", onInput);
    form.addEventListener("submit", async e => {
      e.preventDefault(); if (sending) return;
      const fields = Object.keys(this.validators), results = fields.map(check);
      if (results.includes(false)) { form.elements[fields[results.indexOf(false)]].focus(); status.className = "status bad"; status.textContent = "A few fields need attention before sending."; return; }
      sending = true; btn.disabled = true; btn.innerHTML = `<span class="spin" aria-hidden="true"></span>Sending…`; status.className = "status"; status.textContent = "";
      const data = Object.fromEntries(new FormData(form));
      try {
        const r = await this.submit(data);
        if (r.ok) { form.reset(); status.className = "status ok"; status.textContent = "Thanks — your message has been sent. We’ll be in touch soon."; }
        else if (r.mailto) { status.className = "status warn"; status.innerHTML = `Your email app should open with your message ready — press send there to reach us. Nothing opened? <a href="${r.mailto}" style="color:var(--magenta);text-decoration:underline">Open the email</a> or write to <a href="mailto:${CONFIG.email}" style="color:var(--magenta);text-decoration:underline">${CONFIG.email}</a>.`; }
        else { status.className = "status bad"; status.textContent = "Your message didn’t go through. Check your connection and try again."; }
      } catch { status.className = "status bad"; status.textContent = "Your message didn’t go through. Check your connection and try again."; }
      sending = false; btn.disabled = false; btn.textContent = "Send enquiry";
    });
    return () => {};
  }
};

/* =====================================================================
   PARALLAX — shared, restrained scroll offset for [data-par] (clamped so tiles stay in their grid)
   ===================================================================== */
const Parallax = {
  mount(root){
    const els = $$("[data-par]", root); let raf = 0;
    const update = () => {
      raf = 0;
      const off = RM.matches || innerWidth < 640;
      els.forEach(el => {
        if (off) { el.style.transform = ""; return; }
        const r = el.getBoundingClientRect(), c = r.top + r.height/2 - innerHeight/2;
        const y = Math.max(-70, Math.min(70, -c * parseFloat(el.dataset.par)));
        el.style.transform = `translate3d(0,${y.toFixed(1)}px,0)`;
      });
    };
    const on = () => { if (!raf) raf = requestAnimationFrame(update); };
    addEventListener("scroll", on, {passive:true}); addEventListener("resize", on); update();
    return () => { removeEventListener("scroll", on); removeEventListener("resize", on); cancelAnimationFrame(raf); };
  }
};

/* Small line graphics for service panels (currentColor, so the active state tints them magenta). */
const SERVICE_GFX = [
  `<svg class="gfx" viewBox="0 0 140 100" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="2" width="136" height="96" rx="6"/><line x1="2" y1="22" x2="138" y2="22"/><circle cx="14" cy="12" r="3"/><circle cx="26" cy="12" r="3"/><rect class="mv" style="--ms:1.25;--mx:6px" x="16" y="36" width="50" height="46" fill="currentColor"/><line class="mv" style="--mx:-10px" x1="78" y1="42" x2="124" y2="42"/><line class="mv" style="--mx:-20px" x1="78" y1="56" x2="116" y2="56"/><line class="mv" style="--mx:-6px" x1="78" y1="70" x2="124" y2="70"/></svg>`,
  `<svg class="gfx" viewBox="0 0 140 100" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle class="mv" style="--ms:1.5" cx="62" cy="50" r="16"/><circle class="mv" style="--ms:1.3" cx="62" cy="50" r="30"/><circle class="mv" style="--ms:1.15" cx="62" cy="50" r="44" stroke-dasharray="3 6"/><path class="mv" style="--mx:-14px;--my:-14px" d="M92 60 l26 10 -11 4 -4 11z" fill="currentColor"/></svg>`,
  `<svg class="gfx" viewBox="0 0 140 100" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M34 34h72l-8 56H42z"/><path class="mv" style="--my:-6px" d="M52 34c0-16 36-16 36 0"/><circle class="mv" style="--mx:34px;--my:-18px" cx="16" cy="70" r="7" fill="currentColor"/><circle class="mv" style="--mx:-30px;--my:-10px" cx="124" cy="80" r="5" fill="currentColor"/></svg>`
];

/* =====================================================================
   REVEAL ON SCROLL
   ===================================================================== */
const Reveal = {
  io: null,
  scan(root=document){
    if (!this.io) this.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); this.io.unobserve(e.target); } }), {threshold:.12, rootMargin:"0px 0px -6% 0px"});
    $$("[data-reveal]:not(.in), .rv-tile:not(.in), .fd-anim:not(.in)", root).forEach(el => RM.matches ? el.classList.add("in") : this.io.observe(el));
  }
};

/* =====================================================================
   CURSOR — elastic follower (transform-only, rAF, no layout writes)
   ===================================================================== */
const Cursor = {
  init(){
    if (!FINE.matches) return;
    document.documentElement.classList.add("has-cursor");
    const root = $("#cursor"), ring = $("#cRing"), dot = $("#cDot"), label = $("#cLabel"), tag = $("#cTag");
    let x = innerWidth/2, y = innerHeight/2, rx = x, ry = y, vx = 0, vy = 0, shown = false;
    addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return; x = e.clientX; y = e.clientY; if (!shown) { rx = x; ry = y; shown = true; root.classList.remove("is-hidden"); } }, {passive:true});
    document.addEventListener("pointerleave", () => { root.classList.add("is-hidden"); shown = false; });
    addEventListener("pointerdown", () => root.classList.add("is-down"));
    addEventListener("pointerup", () => root.classList.remove("is-down"));
    document.addEventListener("pointerover", e => {
      const t = e.target.closest("[data-cursor],a,button,input,textarea,select,label");
      root.classList.remove("is-link","is-label","is-text");
      if (!t) return;
      if (t.matches("input,textarea,select")) root.classList.add("is-text");
      else if (t.dataset.cursor) { label.textContent = t.dataset.cursor; root.classList.add("is-label"); }
      else root.classList.add("is-link");
    });
    const tick = () => {
      const stiff = RM.matches ? 1 : .2, damp = RM.matches ? 0 : .62;
      vx = (vx + (x - rx) * stiff) * damp; vy = (vy + (y - ry) * stiff) * damp;
      if (RM.matches) { rx = x; ry = y; } else { rx += vx; ry += vy; }
      const sp = Math.min(Math.hypot(vx, vy), 40), ang = Math.atan2(vy, vx);
      const stretch = RM.matches ? 0 : sp / 90;
      ring.style.transform = `translate3d(${rx}px,${ry}px,0) rotate(${ang}rad) scale(${1+stretch},${1-stretch*.6})`;
      tag.style.transform = `translate3d(${rx}px,${ry}px,0)`;
      dot.style.transform = `translate3d(${x}px,${y}px,0)`;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
};

/* =====================================================================
   ROUTER + PAGE TRANSITIONS
   ===================================================================== */
let cleanup = null, firstLoad = true, navigating = false;
function parseLocation(){
  let raw = CONFIG.routing === "hash" ? (location.hash.slice(1) || "/") : location.pathname + location.search;
  if (!raw.startsWith("/")) raw = "/" + raw;
  const [path, qs=""] = raw.split("?");
  const query = Object.fromEntries(new URLSearchParams(qs));
  return {path: path.replace(/\/+$/,"") || "/", query};
}
function resolve(path){
  if (Pages[path]) return {page: Pages[path], base: path};
  const m = path.match(/^\/work\/([\w-]+)$/); if (m) return {page: Pages["/work/:id"], base:"/work", param:m[1]};
  return {page: Pages["404"], base: null};
}
function setMeta(title, desc, path){
  document.title = title;
  $('meta[name="description"]').content = desc;
  $('meta[property="og:title"]').content = title;
  $('meta[property="og:description"]').content = desc;
  if (CONFIG.siteUrl) {
    let c = $('link[rel="canonical"]'); if (!c) { c = document.createElement("link"); c.rel = "canonical"; document.head.appendChild(c); }
    c.href = CONFIG.siteUrl.replace(/\/$/,"") + path;
    let u = $('meta[property="og:url"]'); if (!u) { u = document.createElement("meta"); u.setAttribute("property","og:url"); document.head.appendChild(u); }
    u.content = c.href;
  }
}
function setActive(base){
  $$("[data-path]").forEach(a => a.dataset.path === base ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
}
function announce(t){ const a = $("#announcer"); a.textContent = ""; setTimeout(() => a.textContent = t, 30); }
function render(){
  const {path, query} = parseLocation();
  const {page, base, param} = resolve(path);
  const view = page(param, query);
  if (cleanup) { try { cleanup(); } catch(e){} cleanup = null; }
  const app = $("#app");
  app.className = "page-enter";
  app.innerHTML = view.html;
  const meta = META[path] || {title: view.title, desc: view.desc};
  setMeta(view.title || meta.title, view.desc || meta.desc, path);
  setActive(base);
  scrollTo(0, 0);
  cleanup = view.mount ? view.mount() : null;
  Reveal.scan(app);
  $$("video[data-autoplay]", app).forEach(v => !RM.matches && v.play().catch(()=>{}));
  requestAnimationFrame(() => requestAnimationFrame(() => app.classList.add("entered")));
  if (!firstLoad) { app.focus({preventScroll:true}); announce(document.title); }
  firstLoad = false;
}
const veil = $("#veil");
function transitionTo(){
  if (RM.matches || firstLoad) { render(); return; }
  if (navigating) { render(); return; }
  navigating = true;
  veil.className = "veil cover";
  setTimeout(() => {
    render();
    veil.className = "veil leave";
    setTimeout(() => { veil.className = "veil"; navigating = false; }, 560);
  }, 420);
}
function navigate(path){
  if (CONFIG.routing === "hash") { if (location.hash === "#" + path) render(); else location.hash = path; }
  else { history.pushState({}, "", path); transitionTo(); }
}
// Intercept internal links for history mode; hash mode works natively.
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]"); if (!a) return;
  closeMenu();
  if (CONFIG.routing !== "history") return;
  const url = new URL(a.href, location.href);
  if (url.origin !== location.origin || a.target === "_blank" || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); navigate(url.pathname + url.search);
});
addEventListener(CONFIG.routing === "hash" ? "hashchange" : "popstate", transitionTo);

/* =====================================================================
   NAV + MOBILE MENU
   ===================================================================== */
const LOGO = $(".logo img").src;
$("#navLinks").innerHTML = NAV.map(n => `<li><a href="${href(n.path)}" data-path="${n.path}">${n.label}</a></li>`).join("");
$("#mobileLinks").innerHTML = NAV.map(n => `<li><a href="${href(n.path)}" data-path="${n.path}">${n.label}</a></li>`).join("");
const menuBtn = $("#menuBtn"), mobileMenu = $("#mobileMenu");
mobileMenu.inert = true;
function openMenu(){ document.body.classList.add("menu-open"); menuBtn.setAttribute("aria-expanded","true"); $("#menuLabel").textContent = "Close"; mobileMenu.inert = false; setTimeout(() => $("a", mobileMenu)?.focus(), 80); }
function closeMenu(){ if (!document.body.classList.contains("menu-open")) return; document.body.classList.remove("menu-open"); menuBtn.setAttribute("aria-expanded","false"); $("#menuLabel").textContent = "Menu"; mobileMenu.inert = true; }
menuBtn.addEventListener("click", () => document.body.classList.contains("menu-open") ? (closeMenu(), menuBtn.focus()) : openMenu());
mobileMenu.addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); menuBtn.focus(); } });
menuBtn.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
addEventListener("resize", () => { if (innerWidth > 860) closeMenu(); });
$("#skip").addEventListener("click", e => { e.preventDefault(); $("#app").focus(); });

Cursor.init();
render();
</script>
